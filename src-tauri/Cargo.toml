[package]
name = "mann-computer"
version = "1.3.4"
description = "Mann Computer - Computer Repair & Sales Management"
authors = ["Mann Computer"]
edition = "2021"

[lib]
name = "mann_computer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mann-computer"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
printpdf = "0.7"
thiserror = "2"
dirs = "6"
base64 = "0.22"
qrcode = "0.14"
image = "0.25"
tauri-plugin-opener = "2.7.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

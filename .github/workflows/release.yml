name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            name: macos-universal
          - platform: ubuntu-22.04
            args: ""
            name: linux-x64
          - platform: windows-latest
            args: "--target x86_64-pc-windows-msvc"
            name: windows-x64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets (macOS universal)
        if: matrix.name == 'macos-universal'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Mann Computer ${{ github.ref_name }}
          releaseBody: |
            Desktop release for Windows, macOS and Linux.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;26.1.10909125"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install frontend dependencies
        run: npm install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mann-release.keystore"
          ls -la "$RUNNER_TEMP/mann-release.keystore"

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/mann-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: npm run tauri android build -- --apk

      - name: Collect APK
        run: |
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          cd out && for f in *.apk; do mv "$f" "mann-computer-${{ github.ref_name }}-android.apk"; done
          ls -la

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mann Computer ${{ github.ref_name }}
          files: out/*.apk

  ios:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        run: npm install

      - name: Initialize iOS project
        run: |
          if [ -z "${APPLE_DEVELOPMENT_TEAM}" ]; then
            echo "::warning::APPLE_DEVELOPMENT_TEAM secret is not set. Skipping iOS build."
            echo "Set the APPLE_DEVELOPMENT_TEAM secret to build and sign the iOS app."
            exit 0
          fi
          npm run tauri ios init -- --config "{\"bundle\":{\"iOS\":{\"developmentTeam\":\"${APPLE_DEVELOPMENT_TEAM}\"}}}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}

      - name: Build iOS app
        run: |
          if [ -z "${APPLE_DEVELOPMENT_TEAM}" ]; then
            echo "::warning::Skipping iOS build - no Apple Developer Team configured."
            exit 0
          fi
          npm run tauri ios build -- --config "{\"bundle\":{\"iOS\":{\"developmentTeam\":\"${APPLE_DEVELOPMENT_TEAM}\"}}}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}

      - name: Upload iOS artifacts
        if: ${{ env.APPLE_DEVELOPMENT_TEAM != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mann-computer-ios
          path: |
            src-tauri/target/aarch64-apple-ios/release/bundle/**/*.ipa
            src-tauri/gen/apple/**/*.ipa
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
